[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evasion"
version = "0.1.0"
description = "Adaptive WAF detection and evasion for authorized security testing"
# Family norm, same as reconnV2. The upper bound is deliberate: the umbrella
# pyproject records that the floor drifted precisely because four of the six
# packages declared no constraint at all.
requires-python = ">=3.12,<3.15"

# Declare every runtime dep. A clean `pip install -e .` MUST import cleanly.
# This was learned the hard way: family_orcha shipped with pyyaml, cryptography
# and httpx all undeclared, so a clean install could not import the package at
# all. The umbrella venv masked it; only isolated CI caught it.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "ruff>=0.16,<0.17", "mypy>=1.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# Rules selected EXPLICITLY. A missing [tool.ruff] means ruff runs whatever its
# defaults are that week -- that is how reconnV2 sat red with 4,636 errors.
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B", "S", "PIE", "C4", "RUF"]
ignore = [
  "S101",  # assert: fine in tests
  "S603", "S607",  # subprocess: not used, but tunnels may need it
  "B008",
  "RUF001", "RUF012",
]

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
namespace_packages = true

[tool.ruff.lint.per-file-ignores]
# Scoped carve-outs for the modules lifted verbatim out of acscan in Phase 1a.
# These files must keep acscan's exact bytes so that
#   diff evasion/<name>.py acscan/acscan/engine/<path>
# stays empty and the move is verifiable in one glance. The alternative --
# 16 inline suppressions -- would edit the moved code and destroy that property.
#
# These are per-file, not global ignores: the rules stay fully live for every
# line of new code written from here on. Cleanup lands with the separate
# behaviour-change commits, never smuggled into the move.
#
#   S311  -- this package exists to produce request polymorphism, where
#           pseudo-randomness is the intended mechanism, not a defect.
#   E701  -- acscan's documented house style (compact one-line `if x: return y`),
#           which its own pyproject ignores for the same reason.
#   PIE790 -- acscan's `except: log; pass` probe pattern in waf_mapper.
"evasion/chameleon.py" = ["S311"]
"evasion/detect.py" = ["E701"]
"evasion/evade.py" = ["S311", "E701"]
"evasion/polymorphic.py" = ["S311"]
"evasion/waf_mapper.py" = ["PIE790"]
"evasion/_net.py" = ["S311", "E701"]
